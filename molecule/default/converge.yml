---
- name: Converge
  hosts: all
  vars:
    system:
      features:
        services: true
      services:
        molecule-disable:
          state: stopped
          enabled: false
        molecule-enable:
          state: started
          enabled: true
        # null entries are skipped
        molecule-missing:
  environment:
    GITHUB_ACTIONS: "maybe"
    ANSIBLE_HASH_BEHAVIOUR: merge
  tasks:
    - name: Include ansible-proserver-system
      ansible.builtin.include_role:
        name: ansible-proserver-system

---
- name: Install GPG on Ubuntu/Debian
  ansible.builtin.apt:
    update_cache: yes
    name: gpg

- name: Configure NodeSource repository
  when: nodejs.version is defined
  block:
    - name: Remove legacy NodeSource repository files
      loop:
        - /etc/apt/sources.list.d/deb_nodesource_com_node_14_x.list
        - /etc/apt/sources.list.d/nodesource.list
        - /usr/share/keyrings/nodesource.gpg
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent

    # deb822_repository needs python3-debian; install_python_debian only exists in ansible-core >= 2.20
    - name: Install python3-debian
      ansible.builtin.apt:
        name: python3-debian

    - name: Add NodeSource repository
      ansible.builtin.deb822_repository:
        name: nodesource
        uris: "https://deb.nodesource.com/node_{{ nodejs.version }}.x"
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

    # Pinned to the major version because state=present would keep an already installed
    # distro nodejs; the NodeSource package conflicts with and replaces the distro npm
    - name: Install Node.js
      ansible.builtin.apt:
        name: "nodejs={{ nodejs.version }}.*"
        update_cache: yes

- name: Template the version lock file
  when: system.apt.version_locks | length > 0
  ansible.builtin.template:
    src: apt/preferences.d/00-ansible
    dest: /etc/apt/preferences.d/00-ansible
    owner: root
    mode: "0644"

- name: Update apt cache and remove unneeded packages
  ansible.builtin.apt:
    update_cache: yes
    autoremove: yes
  changed_when: false

- name: Configure apt proxy
  when: system.apt.proxy is defined and system.apt.proxy != None and system.apt.proxy | length > 0
  ansible.builtin.copy:
    owner: root
    mode: "0644"
    content: |
      Acquire::http::Proxy "{{ system.apt.proxy }}";
    dest: "/etc/apt/apt.conf.d/proxy.conf"

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ system.apt.packages.items() | selectattr('1', 'eq', true) | map(attribute='0') | list }}"
